[project]
name = "morphe-builder"
version = "0.0.0"
description = "Build patched Android APKs with Morphe"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.13.5"]

[project.scripts]
builder = "morphe_builder.__main__:main"

[dependency-groups]
dev = [
  "import-linter>=2.15",
  "ipython>=9.17.1",
  "pyrefly>=1.3.2",
  "ruff>=0.16.10",
]

[tool.importlinter]
root_package = "morphe_builder"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
  "morphe_builder.__main__",
  "morphe_builder.app",
  "morphe_builder.tools | morphe_builder.config",
  "morphe_builder.util",
]

[tool.pyrefly]
preset = "strict"

[tool.uv]
package = true
